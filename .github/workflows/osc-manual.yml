name: OSC manual CI

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Full 40-character commit SHA to check out and test"
        required: true
        type: string

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 1
      - name: Provenance
        run: |
          echo "osc-manual dispatched for target_ref ${{ inputs.target_ref }}"
          git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run backend unit tests
        run: python -m pytest backend/Tests/UnitTests -q
